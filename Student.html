    <script>
        const ROLE = 'STUDENT';

        // Global State
        let state = {
            step: 'join', // join, seat, main
            code: '<?= urlParams.code ?>',
            seat: null,
            activity: null,
            seatsData: [],
            activity: null,
            seatsData: [],
            isHelpActive: false,
            isUploading: false,
            myHistory: [],
            latestSubmission: null,
            historyLoadedKey: '',
            historyLoading: false
        };

        function toggleHelp() {
            if (!state.code || !state.seat) return;
            const newState = !state.isHelpActive;

            // Optimistic UI update
            updateHelpBtnUI(newState);

            google.script.run
                .withSuccessHandler(() => {
                    state.isHelpActive = newState;
                    updateHelpBtnUI(newState);
                    refreshDashboard(); // Sync immediate
                })
                .withFailureHandler(err => {
                    alert('設定失敗: ' + err.message);
                    updateHelpBtnUI(!newState); // Revert
                })
                .studentSetHelpStatus(state.code, Number(state.seat), newState);
        }

        function updateHelpBtnUI(active) {
            const btn = document.getElementById('btnHelp');
            const txt = document.getElementById('helpText');
            if (active) {
                btn.classList.add('bg-red-100', 'border-red-500', 'text-red-700', 'animate-pulse');
                btn.classList.remove('btn-outline');
                txt.textContent = '支援請求中...';
            } else {
                btn.classList.remove('bg-red-100', 'border-red-500', 'text-red-700', 'animate-pulse');
                btn.classList.add('btn-outline');
                txt.textContent = '請求支援';
            }
        }

        window.onload = function () {
            Analytics.trackEvent('student_portal_load');

            // URL code always wins over previous local session to avoid mixing activities.
            const savedCode = localStorage.getItem('led_activityCode');
            const savedSeat = localStorage.getItem('led_seatNo');

            if (state.code) { // URL param
                const urlCode = String(state.code).trim().toUpperCase();
                state.code = urlCode;
                document.getElementById('inputCode').value = urlCode;

                if (savedCode !== urlCode) {
                    localStorage.setItem('led_activityCode', urlCode);
                    localStorage.removeItem('led_seatNo');
                }

                checkActivity();
            } else if (savedCode) {
                state.code = savedCode;
                document.getElementById('inputCode').value = savedCode;

                if (savedSeat) {
                    // Try exact restore
                    restoreSession(savedCode, Number(savedSeat));
                } else {
                    // Just code
                    checkActivity();
                }
            }
        };

        function restoreSession(code, seat) {
            const btn = document.getElementById('btnJoin');
            btn.textContent = '恢復連線中...';
            btn.disabled = true;

            google.script.run
                .withSuccessHandler(act => {
                    state.activity = act;
                    state.code = code;
                    state.seat = seat;

                    // Render UI elements just in case we need to go back
                    renderSeatSelect(act.studentCount);
                    document.getElementById('activityNameDisplay').textContent = act.activityName;
                    document.getElementById('displaySeat').textContent = seat;
                    document.getElementById('displayActivityCode').textContent = code;
                    document.getElementById('displayActivityName').textContent = act.activityName;

                    // Ensure occupied (claim silently)
                    // If occupied by us, good. If free, claim it.
                    // We don't want to fail if it's already occupied (presumably by us).
                    google.script.run
                        .withSuccessHandler(() => {
                            showStep('main');
                        })
                        .withFailureHandler(err => {
                            console.warn('Silent claim failed:', err.message);
                            // Assume we own it or just show main anyway.
                            // If someone else took it, we might want to warn?
                            // For experience, we force show.
                            showStep('main');
                        })
                        .studentClaimSeat(code, seat);

                })
                .withFailureHandler(err => {
                    // Fail to restore, clear session
                    console.error(err);
                    localStorage.removeItem('led_activityCode');
                    localStorage.removeItem('led_seatNo');
                    alert('無法恢復連線，請重新輸入代碼');
                    location.reload();
                })
                .studentGetActivity(code);
        }

        function showStep(s) {
            state.step = s;
            document.getElementById('stepJoin').classList.add('hidden');
            document.getElementById('stepSeat').classList.add('hidden');
            document.getElementById('stepMain').classList.add('hidden');
            document.getElementById('btnExit').classList.add('hidden'); // Default hide

            // Clean state if needed but we rely on state obj

            if (s === 'join') document.getElementById('stepJoin').classList.remove('hidden');
            if (s === 'seat') {
                document.getElementById('stepSeat').classList.remove('hidden');
                document.getElementById('btnExit').classList.remove('hidden'); // Show in seat select
            }
            if (s === 'main') {
                document.getElementById('stepMain').classList.remove('hidden');
                document.getElementById('btnExit').classList.remove('hidden'); // Show in main
                refreshDashboard();
                if (typeof refreshIrsStudentState === 'function') refreshIrsStudentState();

                // Clear existing timer if any meant for polling to avoid dupes? 
                // Simple logic: we rely on one interval. 
                // But setInterval below adds multiple if called multiple times?
                // Yes. Fix: check window.refreshInt
                if (window.refreshInt) clearInterval(window.refreshInt);
                window.refreshInt = setInterval(refreshDashboard, 15000);
            }
        }

        function checkActivity() {
            const code = document.getElementById('inputCode').value.trim().toUpperCase();
            if (!code) return;

            // Save Code
            localStorage.setItem('led_activityCode', code);

            const btn = document.getElementById('btnJoin');
            btn.textContent = '檢查中...';
            btn.disabled = true;
            document.getElementById('joinError').classList.add('hidden');

            google.script.run
                .withSuccessHandler(act => {
                    state.activity = act;
                    state.code = code;
                    renderSeatSelect(act.studentCount);

                    document.getElementById('activityNameDisplay').textContent = act.activityName;
                    showStep('seat');
                })
                .withFailureHandler(err => {
                    document.getElementById('joinError').textContent = err.message;
                    document.getElementById('joinError').classList.remove('hidden');
                    btn.textContent = '進入活動';
                    btn.disabled = false;
                })
                .studentGetActivity(code);
        }

        function renderSeatSelect(count) {
            const grid = document.getElementById('seatSelectGrid'); // Changed ID
            grid.innerHTML = '';

            const occupied = state.activity.enableSeatLock ? (state.activity.occupiedSeats || []) : [];

            for (let i = 1; i <= count; i++) {
                const isTaken = occupied.includes(i);

                const btn = document.createElement('button');
                btn.className = `aspect-square rounded-xl text-lg font-bold flex items-center justify-center transition-all shadow-sm ${isTaken
                    ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                    : 'bg-white border-2 border-slate-200 hover:border-blue-500 hover:text-blue-600 text-slate-600'}`;

                btn.textContent = i;

                if (isTaken) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => handleSeatSelect(i);
                }

                grid.appendChild(btn);
            }
        }

        function handleSeatSelect(seatNo) {
            // Optimistic confirm? No, must claim first
            const btn = document.getElementById('seatSelectGrid').children[seatNo - 1];
            if (btn) {
                btn.textContent = '...';
                btn.disabled = true;
            }

            google.script.run
                .withSuccessHandler(res => {
                    state.seat = seatNo;
                    // Save Seat
                    localStorage.setItem('led_seatNo', seatNo);
                    document.getElementById('displaySeat').textContent = state.seat;
                    document.getElementById('displayActivityCode').textContent = state.code;
                    document.getElementById('displayActivityName').textContent = state.activity.activityName;

                    Analytics.trackEvent('join_activity', {
                        activity_id: state.code,
                        activity_name: state.activity.activityName
                    });

                    showStep('main');
                })
                .withFailureHandler(err => {
                    alert(err.message);
                    if (btn) {
                        btn.textContent = seatNo;
                        btn.disabled = false;
                    }
                    // Refresh availability
                    checkActivity();
                })
                .studentClaimSeat(state.code, seatNo);
        }

        // --- Dashboard Sync (See below for new implementation) ---

        // --- Upload ---
        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function (e) {
                    openEditor(e.target.result);
                };
                reader.readAsDataURL(file);
                input.value = ''; // Clear for re-select
            }
        }

        // --- Modal ---
        function openModal(seatNo) {
            const seat = state.seatsData.find(s => s.seatNo === seatNo);
            if (!seat) return;

            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');

            document.getElementById('modalUserInfo').classList.remove('hidden');
            document.getElementById('modalSeatNo').textContent = seatNo;
            const badge = document.getElementById('modalLightBadge');
            badge.className = `badge badge-${seat.lightStatus ? seat.lightStatus.toLowerCase() : 'none'}`;
            badge.textContent = seat.lightStatus;

            const img = document.getElementById('modalPhoto');
            const noPhoto = document.getElementById('modalNoPhoto');

            if (seat.latestPhotoUrl) {
                img.src = seat.latestPhotoUrl;
                img.classList.remove('hidden');
                noPhoto.classList.add('hidden');
            } else {
                img.classList.add('hidden');
                noPhoto.classList.remove('hidden');
            }

            if (seat.latestAiSuggestion) {
                document.getElementById('modalSuggestion').innerHTML = marked.parse(seat.latestAiSuggestion);
                document.getElementById('modalSuggestion').classList.add('markdown-body');
            } else {
                document.getElementById('modalSuggestion').textContent = '尚無建議';
                document.getElementById('modalSuggestion').classList.remove('markdown-body');
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // --- Camera (Hybrid: JS Stream + Native Fallback) ---
        let stream = null;
        let isPortrait = true;

        async function openCamera() {
            if (typeof startRgbHostedCamera === 'function' && startRgbHostedCamera('student')) return;
            openNativeCamera();
        }

        function openLatestSubmissionDetail() {
            if (state.latestSubmission) openStudentSubmissionDetail(state.latestSubmission);
        }

        function openStudentSubmissionDetail(item) {
            if (!item) return;
            const modal = document.getElementById('studentSubmissionModal');
            const photo = document.getElementById('studentSubmissionPhoto');
            const noPhoto = document.getElementById('studentSubmissionNoPhoto');
            const photoLink = document.getElementById('studentSubmissionOpenPhoto');
            const light = String(item.lightStatus || 'NONE').toUpperCase();
            const score = item.aiScore !== '' && item.aiScore != null ? `${item.aiScore} 分` : '未評分';

            document.getElementById('studentSubmissionTime').textContent = formatStudentHistoryTime(item.uploadAt);
            document.getElementById('studentSubmissionScore').textContent = score;
            const lightBadge = document.getElementById('studentSubmissionLight');
            lightBadge.className = `badge badge-${light.toLowerCase()}`;
            lightBadge.textContent = light;

            if (item.photoUrl) {
                photo.src = item.photoUrl;
                photo.classList.remove('hidden');
                noPhoto.classList.add('hidden');
                photoLink.href = item.photoUrl;
                photoLink.classList.remove('hidden');
            } else {
                photo.removeAttribute('src');
                photo.classList.add('hidden');
                noPhoto.classList.remove('hidden');
                photoLink.classList.add('hidden');
            }

            const suggestion = document.getElementById('studentSubmissionSuggestion');
            if (item.aiSuggestion) {
                suggestion.innerHTML = marked.parse(String(item.aiSuggestion));
                suggestion.classList.add('markdown-body');
            } else {
                suggestion.textContent = '尚無建議';
                suggestion.classList.remove('markdown-body');
            }
            modal.classList.remove('hidden');
        }

        function closeStudentSubmissionDetail() {
            document.getElementById('studentSubmissionModal').classList.add('hidden');
        }

        function formatStudentHistoryTime(value) {
            if (!value) return '時間不明';
            const date = new Date(Number(value) || value);
            return Number.isNaN(date.getTime()) ? '時間不明' : date.toLocaleString('zh-TW');
        }

        function openNativeCamera() {
            document.getElementById('cameraInput').click();
        }

        function switchToNativeCamera() {
            closeCamera();
            openNativeCamera();
        }

        function closeCamera() {
            document.getElementById('cameraOverlay').classList.add('hidden');
            stopCamera();
        }

        async function startCamera() {
            stopCamera();

            const w = isPortrait ? 1080 : 1920;
            const h = isPortrait ? 1920 : 1080;

            const constraints = {
                video: {
                    facingMode: 'environment',
                    width: { ideal: w },
                    height: { ideal: h },
                    aspectRatio: isPortrait ? 0.5625 : 1.777
                },
                audio: false
            };

            // This will throw if permissions denied in iframe
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            const video = document.getElementById('cameraVideo');
            video.srcObject = stream;
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        function toggleOrientation() {
            isPortrait = !isPortrait;
            const icon = document.getElementById('orientationIcon');
            const text = document.getElementById('orientationText');

            if (isPortrait) {
                icon.className = 'border-2 border-white rounded w-4 h-6 block transition-all';
                text.textContent = '直式';
            } else {
                icon.className = 'border-2 border-white rounded w-6 h-4 block transition-all';
                text.textContent = '橫式';
            }
            startCamera().catch(err => {
                console.error('Orientation switch failed:', err);
                switchToNativeCamera();
            });
        }

        function takePhoto() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.createElement('canvas'); // Off-screen
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            closeCamera();
            openEditor(canvas.toDataURL('image/jpeg', 0.9));
        }

        function handleCameraCapture(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function (e) {
                    openEditor(e.target.result);
                };
                reader.readAsDataURL(file);
                input.value = '';
            }
        }

        // --- Editor & Cropper ---
        let cropper = null;


        function openEditor(imageUrl) {
            const editor = document.getElementById('imageEditor');
            const img = document.getElementById('editorImage');

            // Cleanup old
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }

            editor.classList.remove('hidden');
            // Wait for load to init cropper safely
            img.onload = () => {
                cropper = new Cropper(img, {
                    viewMode: 1, // Restrict crop box to canvas size
                    dragMode: 'move',
                    autoCropArea: 0.9,
                    restore: false,
                    guides: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                    background: false
                });
            };

            // Set src AFTER onload listener to avoid race condition with Data URLs
            img.src = imageUrl;
        }

        function rotateImage(deg) {
            if (cropper) cropper.rotate(deg);
        }

        function resetCrop() {
            if (cropper) cropper.reset();
        }

        function closeEditor() {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            document.getElementById('imageEditor').classList.add('hidden');
            // Allow user to retake - we retry the in-app camera
            openCamera();
        }

        function confirmEditor() {
            if (!cropper) return;

            // Get cropped canvas
            const canvas = cropper.getCroppedCanvas({
                maxWidth: 1920,
                maxHeight: 1920,
                fillColor: '#fff',
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });

            const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

            // Close Editor
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            document.getElementById('imageEditor').classList.add('hidden');

            uploadPhoto(base64, 'image/jpeg');
        }

        function uploadPhoto(base64, mimeType) {
            state.isUploading = true; // Set flag start
            // Show loading UI
            document.getElementById('uploadUiNormal').classList.add('hidden');
            document.getElementById('uploadUiLoading').classList.remove('hidden');
            document.getElementById('uploadResult').classList.add('hidden');

            const payload = {
                activityCode: state.code,
                className: state.activity.className || '',
                seatNo: state.seat,
                fileData: {
                    mimeType: mimeType,
                    base64: base64
                }
            };

            const successHandler = (updatedSeat) => {
                state.isUploading = false; // Set flag end
                document.getElementById('uploadUiNormal').classList.remove('hidden');
                document.getElementById('uploadUiLoading').classList.add('hidden');

                // --- DEBUG: Print Rubric to Console ---
                if (updatedSeat && updatedSeat.debugRubricText) {
                    console.log("%c【AI 正在使用的評分方針 (Rubric)】", "color: #0ea5e9; font-weight: bold; font-size: 14px;");
                    console.log(updatedSeat.debugRubricText);
                    console.log("-----------------------------------------");
                }

                // update local and dashboard
                Analytics.trackEvent('submit_photo', {
                    activity_id: state.code,
                    activity_name: state.activity.activityName,
                    ai_score: updatedSeat ? updatedSeat.aiScore : null
                });

                refreshDashboard(); // will update my status
                alert('上傳成功！');
            };

            const failureHandler = (err) => {
                state.isUploading = false; // Set flag end (error case)
                document.getElementById('uploadUiNormal').classList.remove('hidden');
                document.getElementById('uploadUiLoading').classList.add('hidden');
                alert('上傳失敗: ' + err.message);
            };

            if (String(state.code).startsWith('G-')) {
                google.script.run
                    .withSuccessHandler(successHandler)
                    .withFailureHandler(failureHandler)
                    .studentGuestUploadAndEval(payload);
            } else {
                google.script.run
                    .withSuccessHandler(successHandler)
                    .withFailureHandler(failureHandler)
                    .studentUploadAndSubmit(payload);
            }
        }

        // --- Dashboard Sync ---
        function refreshDashboard() {
            // Check if first load (grid empty)
            const list = document.getElementById('seatGrid');
            if (list && list.children.length === 0) {
                list.innerHTML = `
                    <div class="col-span-full flex justify-center py-10">
                        <svg class="animate-spin h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                 `;
            }

            google.script.run
                .withSuccessHandler(renderDashboard)
                .studentGetDashboard(state.code);
        }

        function renderDashboard(data) {
            const seats = data.seats || [];
            state.seatsData = seats;
            const mySeat = seats.find(s => s.seatNo === state.seat);

            // Update My Status
            if (mySeat) {
                const historyKey = `${state.code}:${state.seat}:${mySeat.lastSubmitAt || ''}`;
                fetchMyHistory(historyKey);
                const badge = document.getElementById('myStatusBadge');
                badge.className = `badge badge-${mySeat.lightStatus ? mySeat.lightStatus.toLowerCase() : 'none'} scale-110`;
                badge.textContent = mySeat.lightStatus || '未繳交';

                if ((mySeat.latestPhotoUrl || mySeat.latestAiSuggestion || (mySeat.latestAiScore !== '' && mySeat.latestAiScore != null)) && !state.isUploading) {
                    document.getElementById('uploadResult').classList.remove('hidden');
                    document.getElementById('myPhoto').src = mySeat.latestPhotoUrl || '';
                    document.getElementById('myScore').textContent = mySeat.latestAiScore !== '' && mySeat.latestAiScore != null ? mySeat.latestAiScore + ' 分' : '未評分';
                    state.latestSubmission = {
                        photoUrl: mySeat.latestPhotoUrl || '',
                        aiScore: mySeat.latestAiScore,
                        aiSuggestion: mySeat.latestAiSuggestion || '',
                        lightStatus: mySeat.lightStatus || 'NONE',
                        uploadAt: mySeat.lastSubmitAt || ''
                    };

                    // Use marked to parse markdown
                    const suggestionEl = document.getElementById('mySuggestion');
                    if (mySeat.latestAiSuggestion) {
                        suggestionEl.innerHTML = marked.parse(mySeat.latestAiSuggestion);
                        suggestionEl.classList.add('markdown-body');
                    } else {
                        suggestionEl.textContent = '無建議';
                        suggestionEl.classList.remove('markdown-body');
                    }
                } else if (state.isUploading) {
                    // Keep hidden or ensure hidden if it was visible (though uploadPhoto hides it too)
                    document.getElementById('uploadResult').classList.add('hidden');
                }

                // Sync Help Button State (In case canceled by admin)
                const isMyHelp = (mySeat.isHelpRequested === true || mySeat.isHelpRequested === 'true');
                if (state.isHelpActive !== isMyHelp) {
                    state.isHelpActive = isMyHelp;
                    updateHelpBtnUI(isMyHelp);
                }
            }

            // Update Grid
            const list = document.getElementById('seatGrid');
            list.innerHTML = '';

            seats.forEach(seat => {
                // if (seat.seatNo === state.seat) return; // Optional: show all including self

                const wrapper = document.createElement('div');
                wrapper.className = 'relative group';

                const div = document.createElement('div');
                let colorClass = 'seat-none';
                if (seat.lightStatus === 'RED') colorClass = 'seat-red';
                if (seat.lightStatus === 'YELLOW') colorClass = 'seat-yellow';
                if (seat.lightStatus === 'GREEN') colorClass = 'seat-green';

                div.className = `seat ${colorClass} relative overflow-hidden cursor-pointer`;
                div.onclick = () => openModal(seat.seatNo);

                // Login Status Indicator (Top Right)
                const statusDot = document.createElement('div');
                statusDot.className = `absolute top-2 right-2 w-3 h-3 rounded-full border border-white shadow-sm z-20 ${seat.isOccupied ? 'bg-green-500' : 'bg-slate-300 opacity-50'}`;
                div.appendChild(statusDot);

                // Help Indicator (Outside)
                if (seat.isHelpRequested === true || seat.isHelpRequested === 'true') {
                    const helpBadge = document.createElement('div');
                    helpBadge.className = 'absolute -top-3 -left-3 p-1 z-30 animate-bounce drop-shadow-md';
                    helpBadge.innerHTML = '<span class="text-3xl">🚨</span>';
                    wrapper.appendChild(helpBadge);
                } else if (seat.lastSubmitAt) {
                    // Time Ago (Only if no help, or below help?) 
                    // Let's put Time Ago smaller
                    const timeBadge = document.createElement('span');
                    timeBadge.className = 'absolute top-1 left-1 text-[9px] font-bold opacity-80 text-white z-10';
                    timeBadge.textContent = timeAgo(seat.lastSubmitAt);
                    div.appendChild(timeBadge);
                }

                // Thumbnail
                if (seat.latestPhotoUrl) {
                    const bg = document.createElement('div');
                    bg.className = 'absolute inset-0 bg-cover bg-center opacity-30 mix-blend-overlay pointer-events-none';
                    bg.style.backgroundImage = `url('${seat.latestPhotoUrl}')`;
                    div.appendChild(bg);
                }

                const span = document.createElement('span');
                span.className = 'text-xl font-bold font-mono relative z-10';
                span.textContent = seat.seatNo;
                div.appendChild(span);

                wrapper.appendChild(div);
                list.appendChild(wrapper);
            });
        }

        function timeAgo(ts) {
            if (!ts) return '';
            const diff = (Date.now() - ts) / 60000; // minutes
            if (diff < 1) return '剛剛';
            if (diff < 60) return Math.floor(diff) + 'm';
            if (diff < 1440) return Math.floor(diff / 60) + 'h';
            return Math.floor(diff / 1440) + 'd';
        }

        function fetchMyHistory(historyKey, force) {
            if (!state.code || !state.seat) return;

            const targetKey = historyKey || `${state.code}:${state.seat}`;
            if (!force && (state.historyLoading || state.historyLoadedKey === targetKey)) return;
            state.historyLoading = true;

            const container = document.getElementById('myHistoryList');
            const count = document.getElementById('myHistoryCount');
            if (!state.myHistory.length) {
                if (count) count.textContent = '';
                container.innerHTML = '<div class="py-3 text-center text-xs text-slate-400">正在載入...</div>';
            }

            google.script.run
                .withSuccessHandler(raw => {
                    try {
                        const list = typeof raw === 'string' ? JSON.parse(raw) : raw;
                        renderMyHistory(Array.isArray(list) ? list : []);
                        state.historyLoadedKey = targetKey;
                    } catch (error) {
                        state.myHistory = [];
                        container.innerHTML = `<div class="rounded-lg bg-rose-50 p-3 text-xs text-rose-700">歷史紀錄格式錯誤：${escapeStudentHistoryHtml(error && error.message ? error.message : error)}</div>`;
                    } finally {
                        state.historyLoading = false;
                    }
                })
                .withFailureHandler(error => {
                    state.historyLoading = false;
                    state.historyLoadedKey = targetKey;
                    if (!state.myHistory.length) {
                        container.innerHTML = `<div class="rounded-lg bg-rose-50 p-3 text-xs text-rose-700">歷史紀錄載入失敗：${escapeStudentHistoryHtml(error && error.message ? error.message : error)}<button type="button" onclick="fetchMyHistory('', true)" class="ml-2 font-bold underline">重試</button></div>`;
                    }
                })
                .studentGetHistoryJson(state.code, state.seat);
        }

        function renderMyHistory(list) {
            const container = document.getElementById('myHistoryList');
            const count = document.getElementById('myHistoryCount');
            state.myHistory = list.slice();
            if (count) count.textContent = `（${list.length}）`;
            container.innerHTML = '';

            if (!list.length) {
                container.innerHTML = '<div class="py-3 text-center text-xs text-slate-400">目前尚無作品上傳紀錄</div>';
                return;
            }

            list.forEach((item, index) => {
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'w-full flex items-center gap-3 text-left text-sm border border-slate-100 bg-white p-2 rounded-lg hover:border-blue-300 hover:bg-blue-50/40 transition-colors';
                row.onclick = () => openStudentSubmissionDetail(state.myHistory[index]);

                const image = document.createElement('img');
                image.className = 'w-12 h-12 object-cover rounded bg-slate-200 shrink-0';
                image.alt = '作品縮圖';
                if (item.photoUrl) image.src = item.photoUrl;

                const details = document.createElement('div');
                details.className = 'min-w-0 flex-1';
                const date = document.createElement('div');
                date.className = 'text-[10px] text-slate-400';
                date.textContent = formatStudentHistoryTime(item.uploadAt);
                const result = document.createElement('div');
                result.className = `font-bold ${item.lightStatus === 'GREEN' ? 'text-green-600' : 'text-slate-700'}`;
                result.textContent = item.aiScore !== '' && item.aiScore != null ? `${item.aiScore} 分 · ${item.lightStatus || 'NONE'}` : `未評分 · ${item.lightStatus || 'NONE'}`;
                const suggestion = document.createElement('div');
                suggestion.className = 'mt-1 truncate text-[11px] text-slate-500';
                suggestion.textContent = item.aiSuggestion || '尚無 AI 建議';
                const action = document.createElement('span');
                action.className = 'shrink-0 text-xs font-bold text-blue-600';
                action.textContent = '查看詳情';

                details.append(date, result, suggestion);
                row.append(image, details, action);
                container.appendChild(row);
            });
        }

        function escapeStudentHistoryHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        function handleLeaveSeat() {
            if (!confirm('確定要換座位嗎？')) return;

            const oldSeat = state.seat;
            state.seat = null;

            // Clear Seat Storage
            localStorage.removeItem('led_seatNo');

            // UI instant feedback
            showStep('seat'); // Back to selection

            google.script.run
                .withSuccessHandler(() => {
                    checkActivity(); // Refresh grid
                })
                .studentReleaseSeat(state.code, oldSeat);
        }

        function handleExitActivity() {
            if (!confirm('確定要離開此活動嗎？\n這將會清除您的登入紀錄並回到首頁。')) return;

            // Release seat if any
            if (state.seat) {
                google.script.run.studentReleaseSeat(state.code, state.seat);
            }

            localStorage.clear(); // Clear all
            // Redirect to base URL to clear params
            window.location.href = "<?= ScriptApp.getService().getUrl() ?>?page=student";
        }
        // --- Time Limit ---
        function startClock() {
            if (window.clockInt) clearInterval(window.clockInt);
            const badge = document.getElementById('timeDisplayBadge');

            if (!state.activity || !state.activity.isTimeLimited) {
                if (badge) badge.classList.add('hidden');
                return;
            }

            if (badge) badge.classList.remove('hidden');
            updateTimeDisplay();
            window.clockInt = setInterval(updateTimeDisplay, 1000);
        }

        function updateTimeDisplay() {
            const act = state.activity;
            if (!act || !act.isTimeLimited) return;

            const badge = document.getElementById('timeDisplayBadge');
            if (!badge) return;

            const now = Date.now();
            const start = act.startTime;
            const end = start + (act.limitHours * 3600000);

            if (now < start) {
                badge.textContent = '⏳ 尚未開始';
                badge.className = 'badge badge-warning text-xs';
            } else if (now > end) {
                badge.textContent = '🛑 已結束';
                badge.className = 'badge badge-error text-xs';
            } else {
                // Active
                const left = end - now;
                const hh = Math.floor(left / 3600000);
                const mm = Math.floor((left % 3600000) / 60000);
                const ss = Math.floor((left % 60000) / 1000);
                badge.textContent = `⏱️ ${pad(hh)}:${pad(mm)}:${pad(ss)}`;
                badge.className = 'badge badge-info text-xs font-mono';

                if (left < 300000) { // < 5 mins
                    badge.classList.remove('badge-info');
                    badge.classList.add('badge-warning', 'animate-pulse');
                }
            }
        }

        function pad(n) { return n < 10 ? '0' + n : n; }
    </script>
